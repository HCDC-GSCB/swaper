project:
  type: website
  output-dir: docs
  # pre-render: dashboard/backend.R
  render: 
    - "**/*.qmd"
  
resources:
  - documents/**
  - ebs.html
  - game.html
  - riskmap.html
  - "dashboard/*.dat"
  - "dashboard/hcm_map.json"
  - "dashboard/satscan_dengue.html"

website:
  title: "SWAPER"
  favicon: favicon.png
  search: true
  announcement: 
    icon: info-circle
    dismissable: true
    content: "Website is under construction"
    type: warning
    position: above-navbar
  navbar:
    pinned: true
    left:
      - text: "About us"
        href: about/index.qmd
      - text: "News"
        href: news/index.qmd
      - text: "Seminars"
        href: seminars/index.qmd
      - text: "Learning"
        menu:
          - text: "E-Learning"
            href: learning/index.qmd
          - text: "Book"
            href: book/index.qmd
      - text: "Epidemic Channel"
        icon: card-text
        href: snapshot/index.qmd
      - text: "Dashboard"
        menu:
          - text: "IBS"
            icon: database
            href: dashboard/index.qmd
          - text: "EBS"
            icon: newspaper
            href: ebs.html
    right:
      - text: "Tools"
        menu:
          - text: "Risk map (Demo)"
            icon: map
            href: riskmap.html
          - text: "Chill"
            icon: discord
            href: game.html
      - icon: github
        href: https://github.com/HCDC-GSCB/swaper/

  back-to-top-navigation: true
  page-footer:
    border: true
    background: "#005d88"
    left: |
      📧 Email to: khoagscb@hcdc.gov.vn<br>
      📍 Address: 366A Au Duong Lan Street, Chanh Hung Ward, HCMC
    right: "© 2025 HCDC - SWAPER"

format:
  html:
    respect-user-color-scheme: true
    self-contained: true
    theme:
      light: flatly
      dark: darkly
    toc: true
    embed-resources: false
    css: custom_v2.css
    include-before-body: loading.html

editor: source