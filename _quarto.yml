project:
  type: website
  output-dir: docs
  # pre-render: dashboard/backend.R
  render: 
    - "**/*.qmd"
  
resources:
  - documents/**
  - ebs.html
  - game.html
  - riskmap.html
  - "dashboard/*.dat"
  - "dashboard/hcm_map.json"
  - "dashboard/satscan_dengue.html"

website:
  title: "SWAPER"
  favicon: favicon.png
  search: true
  announcement: 
    icon: info-circle
    dismissable: true
    content: "Website is under construction"
    type: warning
    position: above-navbar
  navbar:
    pinned: true
    left:
      - text: "About us"
        href: about/index.qmd
      - text: "News"
        href: news/index.qmd
      - text: "SOPs"
        href: sops/index.qmd
      - text: "Learning"
        menu:
          - text: "E-Learning"
            href: learning/index.qmd
          - text: "Book"
            href: book/index.qmd
          - text: "Seminars"
            href: seminars/index.qmd
      - text: "Epidemic Channel"
        icon: card-text
        href: snapshot/index.qmd
      - text: "Dashboard"
        menu:
          - text: "IBS"
            icon: database
            href: dashboard/index.qmd
          - text: "EBS"
            icon: newspaper
            href: ebs.html
    right:
      - text: "Tools"
        menu:
          - text: "Risk map (Demo)"
            icon: map
            href: riskmap.html
          - text: "Chill"
            icon: discord
            href: game.html
      - icon: github
        href: https://github.com/HCDC-GSCB/swaper/

  back-to-top-navigation: true
  page-footer:
    border: false
    left: |
      <div class="footer-info">
        <span class="footer-item"><i class="bi bi-envelope-at-fill"></i> khoagscb@hcdc.gov.vn</span>
        <span class="footer-item"><i class="bi bi-geo-alt-fill"></i> 366A Au Duong Lan Street, Chanh Hung Ward, HCMC</span>
      </div>
    right: |
      <div class="footer-copyright">
        <strong>SWAPER</strong> © 2025<br>
        Ho Chi Minh City Center for Disease Control
      </div>

format:
  html:
    respect-user-color-scheme: true
    theme:
      light: flatly
      dark: darkly
    toc: true
    embed-resources: false
    css: custom_v2.css
    include-before-body: loading.html

editor: source