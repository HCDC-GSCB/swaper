project:
  type: website
  output-dir: docs

resources:
  - scan-media.html

website:
  title: "SWAPER"
  favicon: logo.png
  navbar:
    left:
      - text: "Home"
        icon: house
        href: index.qmd
      - text: "Seminars"
        menu: 
          - text: "All seminars"
            href: exp1.qmd
          - text: "Registered"
            href: exp2.qmd
      - text: "Training"
        href: training.qmd
      - text: "Scan media"
        icon: newspaper
        href: scan-media.html
      - text: "Documents"
        href: document.qmd
    right:
      - icon: github
        href: https://github.com/HCDC-GSCB/

  sidebar:
    - id: documents
      title: "Documents"
      style: "docked"
      contents:
        - section: "Modelling team"
          contents:
            - htgs.qmd
            - threshold.qmd
        - section: "PHEOC team"
          contents:
            - ghs.qmd
            - phem.qmd
            - pheoc.qmd
        - section: "R language"
          contents:
            - intro.qmd
            - r01.qmd
            - r02.qmd
            - r03.qmd
            - r04.qmd

  back-to-top-navigation: true
  page-footer: "Copyright 2025, SWAPER"

format:
  html:
    respect-user-color-scheme: true
    self-contained: true
    theme:
      light: flatly
      dark: darkly
    toc: true
    css: custom.css
    includes: 
      after-body: loading.html

editor: visual
